<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main class="app">

        <header class="header">
            <div class="shield">🛡️</div>

            <div>
                <h1>CyberShield</h1>
                <p>Browser Security</p>
            </div>
        </header>

        <section id="loading" class="loading">
            <div class="spinner"></div>
            <p>Analyzing website...</p>
        </section>

        <section id="result" class="hidden">

            <!-- MAIN SECURITY STATUS -->
            <div id="statusCard" class="status-card">

                <div id="statusIcon" class="status-icon">✓</div>

                <div class="status-content">
                    <div id="classification" class="classification">
                        SAFE
                    </div>

                    <div class="score">
                        Risk Score:
                        <strong id="score">0</strong>
                        <span>/100</span>
                    </div>
                </div>

            </div>

            <!-- RISK BAR -->
            <section class="risk-section">

                <div class="risk-header">
                    <span>Risk Level</span>
                    <strong id="riskLabel">LOW</strong>
                </div>

                <div class="risk-bar">
                    <div id="riskFill" class="risk-fill"></div>
                </div>

            </section>

            <!-- SECURITY MESSAGE -->
            <section id="securityMessage" class="security-message">
                <strong id="securityMessageTitle">
                    Website appears safe
                </strong>

                <p id="securityMessageText">
                    No significant security indicators were detected.
                </p>
            </section>

            <!-- CURRENT WEBSITE -->
            <section class="url-section">

                <div class="section-title">
                    CURRENT WEBSITE
                </div>

                <div id="currentUrl" class="url">
                    Loading...
                </div>

            </section>

            <!-- ANALYSIS -->
            <section class="reasons-section">

                <div class="section-title">
                    DETECTED INDICATORS
                </div>

                <div id="reasons"></div>

            </section>

            <!-- FEATURES -->
            <section class="features-section">

                <div class="section-title">
                    TECHNICAL ANALYSIS
                </div>

                <div id="features"></div>

            </section>

            <!-- ACTION -->
            <button id="reanalyze" class="reanalyze">
                ↻ Re-analyze
            </button>

        </section>

        <!-- ERROR -->
        <section id="error" class="error hidden">

            <div class="error-title">
                ⚠ Analysis unavailable
            </div>

            <p id="errorMessage"></p>

        </section>

        <footer>
            CyberShield • SIH 2026 Prototype
        </footer>

    </main>

    <script src="popup.js"></script>
</body>
</html>
